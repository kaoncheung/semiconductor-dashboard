<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>研究報告 — 2026年7月16日</title>
  <style>
    :root {
      --primary: #1a365d;
      --accent: #2b6cb0;
      --accent-light: #ebf4ff;
      --border: #cbd5e0;
      --text: #2d3748;
      --muted: #718096;
      --bg: #f0f4f8;
      --card: #ffffff;
      --semi:  #553c9a; --semi-l: #faf5ff;
      --water: #2b6cb0; --water-l: #ebf8ff;
      --power: #c05621; --power-l: #fffaf0;
      --energy:#276749; --energy-l:#f0fff4;
      --cable: #2c7a7b; --cable-l: #e6fffa;
      --land:  #744210; --land-l: #fffbeb;
      --infra: #702459; --infra-l: #fff5f7;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.8;font-size:15px}

    header{background:var(--primary);color:#fff;padding:2rem 2.5rem 1.5rem}
    header .meta{font-size:.75rem;opacity:.65;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.4rem}
    header h1{font-size:1.65rem;font-weight:700}
    header p.sub{margin-top:.3rem;font-size:.88rem;opacity:.8}

    nav{background:var(--accent);padding:0 1.5rem;display:flex;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.18)}
    nav a{color:rgba(255,255,255,.85);text-decoration:none;padding:.65rem .75rem;font-size:.78rem;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap;transition:all .15s}
    nav a:hover{color:#fff;border-bottom-color:rgba(255,255,255,.6)}

    main{max-width:1060px;margin:2rem auto;padding:0 1.5rem 5rem}

    .section{margin-bottom:3.5rem}
    .section-header{display:flex;align-items:center;gap:.75rem;margin-bottom:1.5rem;padding-bottom:.75rem;border-bottom:2px solid var(--border)}
    .tag{display:inline-block;padding:.25rem .7rem;border-radius:4px;font-size:.7rem;font-weight:700;letter-spacing:.05em;color:#fff;text-transform:uppercase}
    .section-header h2{font-size:1.2rem;font-weight:700;color:var(--primary)}

    .zone-label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:.3rem .75rem;border-radius:4px;display:inline-block;margin-bottom:.75rem}
    .zone-tw{background:#fff3cd;color:#856404;border:1px solid #ffc107}
    .zone-intl{background:#cfe2ff;color:#084298;border:1px solid #9ec5fe}

    .zone{margin-bottom:1.5rem}
    .news-grid{display:grid;gap:.85rem}
    .news-card{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:6px;padding:1rem 1.1rem}
    .news-card h3{font-size:.93rem;font-weight:600;margin-bottom:.35rem;color:var(--primary)}
    .news-card p{font-size:.87rem;color:var(--text)}
    .news-card .src{margin-top:.5rem;font-size:.76rem;color:var(--muted)}
    .news-card .src a{color:var(--accent);text-decoration:none}
    .news-card .src a:hover{text-decoration:underline}

    .box{border-radius:6px;padding:1rem 1.25rem;margin-bottom:1rem}
    .box h4{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.5rem}
    .box p{font-size:.88rem}
    .box p+p{margin-top:.55rem}
    .analysis{background:var(--accent-light);border:1px solid #bee3f8}
    .analysis h4{color:var(--accent)}
    .tw-box{background:#fffaf0;border:1px solid #f6ad55;border-left:4px solid #ed8936}
    .tw-box h4{color:#c05621}

    .semi  .news-card{border-left-color:var(--semi)}  .semi  .tag{background:var(--semi)}
    .water .news-card{border-left-color:var(--water)} .water .tag{background:var(--water)}
    .power .news-card{border-left-color:var(--power)} .power .tag{background:var(--power)}
    .energy .news-card{border-left-color:var(--energy)}.energy .tag{background:var(--energy)}
    .cable .news-card{border-left-color:var(--cable)} .cable .tag{background:var(--cable)}
    .land  .news-card{border-left-color:var(--land)}  .land  .tag{background:var(--land)}
    .infra .news-card{border-left-color:var(--infra)} .infra .tag{background:var(--infra)}

    footer{text-align:center;font-size:.76rem;color:var(--muted);padding:2rem;border-top:1px solid var(--border);margin-top:3rem}
    @media(max-width:600px){header{padding:1.5rem 1rem}main{padding:0 1rem 3rem}}
  </style>
</head>
<body>
