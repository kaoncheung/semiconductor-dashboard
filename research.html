<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ann's Research Hub</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --card-hover: #21263a;
      --border: #2a2f45;
      --accent: #4f8ef7;
      --accent2: #7c5cbf;
      --text: #e2e8f0;
      --muted: #7a8499;
      --tag-new: #38a169;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem 5rem;
    }

    /* ── Header ── */
    .hero {
      text-align: center;
      margin-bottom: 3rem;
    }
    .hero .greeting {
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    .hero h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #4f8ef7 0%, #9b72f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.4rem;
    }
    .hero .sub {
      font-size: 0.9rem;
      color: var(--muted);
    }
    #live-date {
      font-size: 0.85rem;
      color: var(--accent);
      margin-top: 0.3rem;
      font-variant-numeric: tabular-nums;
    }

    /* ── Topics bar ── */
    .topics {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 2.5rem;
      max-width: 780px;
    }
    .topics span {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 0.3rem 0.9rem;
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* ── Report list ── */
    .report-list {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .report-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem 1.4rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
      text-decoration: none;
      color: var(--text);
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      position: relative;
      overflow: hidden;
    }
    .report-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--accent), var(--accent2));
      border-radius: 3px 0 0 3px;
    }
    .report-card:hover {
      background: var(--card-hover);
      border-color: var(--accent);
      transform: translateX(3px);
    }

    .report-date {
      min-width: 110px;
      text-align: center;
    }
    .report-date .day {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .report-date .month-year {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    .report-info { flex: 1; }
    .report-info .title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .report-info .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .report-info .tags span {
      font-size: 0.7rem;
      padding: 0.15rem 0.55rem;
      border-radius: 99px;
      background: rgba(79,142,247,0.12);
      color: #7db5ff;
      border: 1px solid rgba(79,142,247,0.2);
    }

    .badge-new {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.2rem 0.55rem;
      border-radius: 99px;
      background: rgba(56,161,105,0.15);
      color: #68d391;
      border: 1px solid rgba(56,161,105,0.3);
      white-space: nowrap;
    }

    .arrow {
      color: var(--muted);
      font-size: 1rem;
      transition: color 0.15s;
    }
    .report-card:hover .arrow { color: var(--accent); }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 2rem;
    }

    /* ── Section label ── */
    .section-label {
      width: 100%;
      max-width: 780px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 0.75rem;
      padding-left: 0.2rem;
    }

    /* ── Footer ── */
    footer {
      margin-top: 3rem;
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 500px) {
      .report-date { min-width: 70px; }
      .report-date .day { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="greeting">Good morning, Ann 👋</div>
    <h1>Research Hub</h1>
    <div class="sub">每日科技與資源政策研究報告彙整</div>
    <div id="live-date"></div>
  </div>

  <div class="topics">
    <span>💠 半導體</span>
    <span>💧 水資源</span>
    <span>⚡ 電力</span>
    <span>🌿 能源政策</span>
    <span>🌐 海底電纜</span>
    <span>🏗️ 土地資源</span>
    <span>🛣️ 公共建設</span>
  </div>

  <div class="section-label">所有報告 — 最新在上</div>

  <div class="report-list" id="report-list">

    <!-- ── 2026-05-31 ── -->
    <a class="report-card" href="research_20260531.html">
      <div class="report-date">
        <div class="day">31</div>
        <div class="month-year">May 2026</div>
      </div>
      <div class="report-info">
        <div class="title">科技與資源政策動態週報</div>
        <div class="tags">
          <span>半導體</span><span>水資源</span><span>電力</span>
          <span>能源政策</span><span>海底電纜</span><span>土地資源</span><span>公共建設</span>
        </div>
      </div>
      <span class="badge-new">Latest</span>
      <span class="arrow">›</span>
    </a>

    <!-- 每次新增報告請在上方加入新的 report-card -->

  </div>

  <footer>
    <p>每日由 AI 自動更新 · 報告儲存於 /Users/ann/nycu/research/</p>
  </footer>

  <script>
    // 顯示今天日期與問候語
    const now = new Date();
    const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
    document.getElementById('live-date').textContent = now.toLocaleDateString('zh-TW', options);

    // 依小時調整問候語
    const h = now.getHours();
    const greet = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
    document.querySelector('.greeting').textContent = greet + ', Ann 👋';
  </script>

</body>
</html>
